  document.title = data.title + ' | Costa Blanca Invest';
  document.documentElement.lang = currentLang;
  const og = document.querySelector('meta[property="og:locale"]');
  if(og) og.setAttribute('content', ogLocale());
  const desc = data.seoDescription || data.desc || data.price || data.meta || 'Costa Blanca Invest';
  const image = data.shareImage || data.image;
  const url = data.shareUrl;
  const set = (selector,value) => { const el = document.querySelector(selector); if(el) el.setAttribute('content',value); };
  const link = document.getElementById('canonicalLink'); if(link) link.href = url;
  const imageLink = document.getElementById('imageSrcLink'); if(imageLink) imageLink.href = image;
  set('meta[name="description"]',desc);
  set('meta[property="og:title"]',data.title);
  set('meta[property="og:description"]',desc);
  set('meta[property="og:url"]',url);
  set('meta[property="og:image"]',image);
  set('meta[property="og:image:url"]',image);
  set('meta[property="og:image:secure_url"]',image);
  set('meta[property="og:image:alt"]',data.title);
  set('meta[name="twitter:title"]',data.title);
  set('meta[name="twitter:description"]',desc);
  set('meta[name="twitter:image"]',image);
  set('meta[name="twitter:url"]',url);
}

      + '<div class="hero-overlay">'

      + '</div></div><div class="gallery-grid">' + gallery + '</div></section>'

    function copyShareUrl(url, btn){
  const original = btn ? (btn.dataset.originalText || btn.textContent || data.ui.copy_plain) : data.ui.copy_plain;
  if(btn) btn.dataset.originalText = original;

  function markCopied(){
    if(!btn) return;
    btn.textContent = currentLang==='ru' ? 'Скопировано ✓' : currentLang==='en' ? 'Copied ✓' : currentLang==='es' ? 'Copiado ✓' : 'Skopiowano ✓';
    btn.classList.add('copied');
    setTimeout(function(){
      btn.textContent = original;
      btn.classList.remove('copied');
    }, 1600);
  }

  if(navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(url).then(markCopied).catch(function(){
      return fallbackCopy(url, markCopied);
    });
  }
  return fallbackCopy(url, markCopied);
}

function fallbackCopy(url, done){
  const input = document.createElement('textarea');
  input.value = url;
  input.setAttribute('readonly','');
  input.style.position = 'fixed';
  input.style.left = '-9999px';
  input.style.top = '0';
  document.body.appendChild(input);
  input.focus();
  input.select();
  try{
    document.execCommand('copy');
    if(done) done();
  }catch(e){
    window.prompt('Copy link:', url);
  }
  document.body.removeChild(input);
}

const shareIcon = document.getElementById('sharePropertyBtn');
const shareBox = document.getElementById('sharePreviewBox');
const copyBtn = document.getElementById('copyPreviewLink');

shareIcon?.addEventListener('click', function(event){
  event.preventDefault();
  event.stopPropagation();
  if(!shareBox) return;
  shareBox.classList.toggle('open');
  shareBox.setAttribute('aria-hidden', shareBox.classList.contains('open') ? 'false' : 'true');
});

copyBtn?.addEventListener('click', function(event){
  event.preventDefault();
  event.stopPropagation();
  copyShareUrl(this.dataset.copyUrl || data.shareUrl, this);
});
  }catch(error){
    console.error('renderProperty error:', error);
    templateApp.className = 'not-found';
    templateApp.innerHTML = '<h1>Błąd ładowania oferty</h1><p>' + esc(error.message || error) + '</p>';
  }
}
function renderNotFound(){ templateApp.className = 'not-found'; templateApp.innerHTML = '<h1>Nie znaleziono oferty</h1><p>slug: ' + esc(requestedSlug) + '</p>'; }
async function fetchJsonFrom(url){ const response = await fetch(url,{cache:'no-store'}); if(!response.ok) throw new Error(url); const data = await response.json(); if(!Array.isArray(data)) throw new Error(url); return data; }
async function loadProjects(){
  for(const url of PROJECTS_URLS){
    try{ const projects = await fetchJsonFrom(url); const item = findProject(projects,requestedSlug); if(item){ renderProperty(item); return; } }
    catch(error){ console.warn('JSON failed',url,error); }
  }
  const fallback = findProject(FALLBACK_PROJECTS,requestedSlug) || FALLBACK_PROJECTS[0];
  if(fallback) renderProperty(fallback); else renderNotFound();
}
window.handleBrokenImage = function(img){ if(img.dataset.fallbackApplied === 'true') return; img.dataset.fallbackApplied = 'true'; img.src = abs(FALLBACK_IMAGE); };
document.getElementById('backLink')?.addEventListener('click', event => { event.preventDefault(); window.location.href = '/pl/new-developments/'; });

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const nextLang = btn.dataset.lang;
    if(!['pl','es','en','ru'].includes(nextLang) || nextLang === currentLang) return;
    currentLang = nextLang;
    const url = new URL(window.location.href);
    if(currentLang === 'pl') url.searchParams.delete('lang');
    else url.searchParams.set('lang', currentLang);
    window.history.replaceState({}, '', url.pathname + url.search + url.hash);
    syncLangUI();
    const currentSlug = requestedSlug;
    loadProjects();
  });
});

syncLangUI();
loadProjects();
