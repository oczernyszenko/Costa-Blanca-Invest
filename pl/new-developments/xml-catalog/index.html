    function resolveShareSlug(itemOrData){
      const item = itemOrData || {};

      // 1) Best option: define this once in projects.json and everything works automatically.
      const explicit = item.shareSlug || item.share_slug || item.canonicalSlug || item.canonical_slug || item.shortSlug || item.short_slug;
      if(explicit) return slugifyShareValue(explicit);

      // 2) Existing aliases from GALLERY_PATCHES, for objects imported with long CRM/API slugs.
      const directPatch = GALLERY_PATCHES[item.slug];
      if(typeof directPatch === 'string') return slugifyShareValue(directPatch);

      const keys = slugCandidates(item);
      const patchKey = Object.keys(GALLERY_PATCHES).find(key =>
        keys.some(candidate => candidate === normalize(key) || candidate.includes(key) || key.includes(candidate))
      );
      if(patchKey){
        const patch = GALLERY_PATCHES[patchKey];
        if(typeof patch === 'string') return slugifyShareValue(patch);
        return slugifyShareValue(patchKey);
      }

      // 3) Universal fallback for all future pages.
      return slugifyShareValue(item.slug || requestedSlug || item.title || 'property');

    async function copyText(value){
      try{
        if(navigator.clipboard && window.isSecureContext){
          await navigator.clipboard.writeText(value);
          return true;
        }
      }catch(error){console.warn('Clipboard API failed:', error);}

      const input=document.createElement('textarea');
      input.value=value;
      input.setAttribute('readonly','');
      input.style.position='fixed';
      input.style.left='-9999px';
      document.body.appendChild(input);
      input.select();
      let ok=false;
      try{ok=document.execCommand('copy');}catch(error){console.warn('execCommand copy failed:', error);}
      document.body.removeChild(input);
      if(!ok) window.prompt('Copy link:', value);
      return ok;
    }

    async function translateTextViaApi(text, targetLang){
      const sourceText = String(text || '').trim();
      if(!sourceText || targetLang === 'pl') return sourceText;

      const cacheKey = translationCacheKey(sourceText, targetLang);
      try{
        const cached = localStorage.getItem(cacheKey);
        if(cached) return cached;
      }catch(error){
        console.warn('Translation cache unavailable:', error);
      }

      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 6500);
      try{
        const response = await fetch(TRANSLATE_ENDPOINT, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({
            text: sourceText,
            sourceLang: 'pl',
            targetLang,
            targetLanguage: translationTargetName(targetLang),
            context: 'Luxury real estate listing for Costa Blanca Invest. Keep brand names, prices and locations unchanged.'
          }),
          signal: controller.signal
        });
        clearTimeout(timer);
        if(!response.ok) throw new Error(`Translation API HTTP ${response.status}`);
        const data = await response.json();
        const translated = String(data.text || data.translatedText || data.translation || '').trim();
        if(translated){
          try{ localStorage.setItem(cacheKey, translated); }catch(error){}
          return translated;
        }
      }catch(error){
        clearTimeout(timer);
        console.warn('Translation API fallback:', error.message || error);
      }

      const fallback = localTranslationFallback(sourceText, targetLang);
      try{ localStorage.setItem(cacheKey, fallback); }catch(error){}
      return fallback;
    }

      }
      return results;
    }

    function valueIsUseful(value){
      if(value === null || value === undefined || value === '') return false;
      if(Array.isArray(value)) return value.length > 0;
      if(typeof value === 'object') return Object.keys(value).length > 0;
      return true;
    }

    function valueToDisplay(value){
      if(!valueIsUseful(value)) return '';
      if(Array.isArray(value)){
        return value.map(v => typeof v === 'object' ? (v.title || v.name || v.label || v.value || JSON.stringify(v)) : String(v)).filter(Boolean).join(', ');
      }
      if(typeof value === 'object'){
        return Object.entries(value).filter(([,v])=>valueIsUseful(v)).map(([k,v])=>`${fieldLabel(k)}: ${valueToDisplay(v)}`).join(' · ');
      }
      return localizeValue(String(value));
    }

    function addField(list, key, value, customLabel){
      if(!valueIsUseful(value)) return;
      const text=valueToDisplay(value);
      if(!text) return;
      const label=customLabel || fieldLabel(key);
      const duplicate=list.some(item => item.label === label && item.value === text);
      if(!duplicate) list.push({label, value:text});
    }

    function buildSourceLinks(item){
      const links=[];
      const add=(title,href)=>{
        if(!href || typeof href !== 'string') return;
        const url=abs(href);
        if(!links.some(x=>x.href===url)) links.push({title,href:url});
      };
      add('Metainmo', item.source_url);
      add('Project', item.href);
      if(item.metainmoVerified) add('Verified source', item.metainmoVerified.source_url);
      if(item.location && item.location.mapUrl) add('Map', item.location.mapUrl);
      add('Video', item.video_url);
      return links;
    }

        ...arr(item.metainmoVerified?.amenities,[]),
        ...arr(item.metainmoVerified?.propertyTypes,[])
      ];
      const seen=new Set();
      return raw.map(x=>String(x).trim()).filter(Boolean).filter(x=>{
        const key=normalize(x);
        if(seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

        ${i < data.paramEntries.length-1 ? '<span class="param-sep">•</span>' : ''}
      `).join('');
      const whyHtml=data.why.map(item=>`<div class="why-item"><strong>${esc(item.title)}</strong><p>${esc(item.text)}</p></div>`).join('');
      const specHtml=data.specs.map(item=>`<li>${esc(item)}</li>`).join('');
      const audienceHtml=data.audience.map(item=>`<div class="audience-card"><strong>${esc(item.title)}</strong><p>${esc(item.text)}</p></div>`).join('');
      const relatedHtml=getRelatedCards(data.slug);
      const shareUrl=getShareUrl(data);
      const propertyUrl=getPropertyUrl(data);
      const waText=encodeURIComponent([
        `🏡 ${data.title}`,
        `💰 ${data.price}`,
        `🔗 ${shareUrl}`
      ].filter(Boolean).join(String.fromCharCode(10)));
      templateApp.className='';
      templateApp.innerHTML=`
        <section class="hero-card">
          <div class="hero-media" data-media-src="${esc(data.image)}">
            <img id="heroImage" src="${esc(data.image)}" alt="${esc(data.title)}" fetchpriority="high" loading="eager" decoding="async" onerror="window.handleBrokenImage&&window.handleBrokenImage(this)">
            <div class="hero-badge">${esc(data.chip)}</div>
            <div class="hero-overlay">
              <div class="hero-copy">
                <div class="hero-kicker">Costa Blanca Invest</div>
                <div class="hero-display">${esc(data.title)}</div>
                <p class="hero-sub">${esc(data.desc)}</p>
                
              </div>
              <div class="hero-price-box luxury-price-card">
                <small>${esc(data.ui.price_box_title)}</small>
                <div class="hero-price-range luxury-price-range">
                  <span class="luxury-price-pill"><span class="luxury-price-label">${esc(getFromLabel())}</span><span class="luxury-price-value">${esc(data.p1||data.price)}</span></span>
                  ${data.p2?`<span class="luxury-price-arrow">→</span><span class="luxury-price-pill"><span class="luxury-price-label">${esc(getToLabel())}</span><span class="luxury-price-value">${esc(data.p2)}</span></span>`:''}
                </div>
                <span class="hero-price-note luxury-price-note">${esc(data.price)}</span>
                <span class="hero-price-meta">${esc(data.meta)}</span>
              </div>
            </div>
          </div>
          
          <div class="gallery-grid">${gallery}</div>
        </section>
        ${floorPlansHtml?`<section class="section-card gallery-section"><h2>${currentLang==='ru'?'Планировки':currentLang==='en'?'Floor plans':currentLang==='es'?'Planos':'Plany'}</h2><div class="gallery-grid">${floorPlansHtml}</div></section>`:''}
        ${documentsHtml?`<section class="section-card"><h2>${currentLang==='ru'?'Документы':currentLang==='en'?'Documents':currentLang==='es'?'Documentos':'Dokumenty'}</h2><ul class="document-list">${documentsHtml}</ul></section>`:''}
        <div class="content">
          <h1 class="hero-title">${esc(data.title)}</h1>${renderProductCode(item)}
          <div class="subtitle">${esc(data.meta)}</div>
          <div class="price">${esc(data.price)}</div>
          <div class="price-soft">Costa Blanca Invest</div>
          <div class="luxury-param-line">${paramsHtml}</div>
          ${data.leads.map(text=>`<p class="lead">${esc(text)}</p>`).join('')}
        </div>
        ${curatedLuxuryHtml}
        ${featuresHtml}
        ${fullSectionsHtml}
        ${sourceLinksHtml}
        ${relatedHtml?`<section class="section-card"><h2>${esc(data.ui.related)}</h2><div class="related-grid">${relatedHtml}</div></section>`:''}
        <section class="cta-box contact-box" id="contact">
          <div class="urgency-note">${esc(data.ui.urgency_note)}</div><h2>${esc(data.ui.contact_title)}</h2><p>${esc(data.ui.contact_intro)}</p>
          <div class="representative-card"><div><div class="representative-name">Olga Chernyshenko</div><div class="representative-role">${esc(data.ui.representative_role)}</div><p class="representative-meta">${esc(data.ui.representative_meta)}</p></div><img class="representative-avatar" src="${abs(AGENT_AVATAR)}" alt="Olga Chernyshenko" loading="lazy" decoding="async" fetchpriority="low" onerror="window.handleBrokenImage&&window.handleBrokenImage(this)"></div>
          <div class="cta-actions"><a class="btn btn-main" href="tel:${CONTACT.phone}">${esc(data.ui.call_btn)}</a><a class="btn btn-light" href="https://wa.me/${CONTACT.whatsapp}?text=${waText}" target="_blank" rel="noopener noreferrer">${esc(data.ui.wa_btn)}</a></div>
          <form class="contact-form" id="contact-form"><div class="contact-form-grid"><input name="name" placeholder="${esc(data.ui.form_name)}" required><input name="phone" placeholder="${esc(data.ui.form_phone)}" required></div><input name="email" placeholder="${esc(data.ui.form_email)}"><textarea name="message" placeholder="${esc(data.ui.form_message)}">${esc(data.title)}</textarea><button class="btn btn-main" type="submit">${esc(data.ui.form_submit)}</button></form>
        </section>
        <div class="share-block">
          <div class="share-actions">
            <button class="share-icon-btn" type="button" id="sharePropertyBtn" data-share-url="${esc(shareUrl)}" aria-label="Share this property" title="${esc(data.title)} · ${esc(data.price)} · ${esc(shareUrl)}">🔗</button>
          </div>
          <div class="share-preview" id="sharePreviewBox" aria-hidden="true">
            <img src="${esc(data.shareImage || data.image)}" alt="${esc(data.title)}" loading="lazy" decoding="async" fetchpriority="low" onerror="window.handleBrokenImage&&window.handleBrokenImage(this)">
            <div>
              <div class="share-preview-title">${esc(data.title)}</div>
              <div class="share-preview-price">${esc(getShareLine(data))}</div>
              
              <div class="share-preview-actions">
                <button class="share-mini-btn" type="button" id="copyPreviewLink">${esc(data.ui.copy_plain)}</button>
                <button class="share-mini-btn light" type="button" id="nativeSharePreview">${esc(data.ui.share_plain)}</button>
                <button class="share-mini-btn facebook" type="button" id="facebookSharePreview" aria-label="Share on Facebook">Facebook</button>
              </div>
            </div>
          </div>
        </div>`;
      bindDynamicEvents(data);
      document.getElementById('sharePropertyBtn')?.addEventListener('click',()=>{
        // Main share icon always opens the beautiful share panel.
        // This avoids silent failures in Facebook/desktop browsers.
        toggleSharePreview();
      });
      document.getElementById('copyPreviewLink')?.addEventListener('click',async(event)=>{
        const btn=event.currentTarget;
        const original=btn.textContent;
        await copyText(shareUrl);
        btn.textContent=data.ui.copied;
        setTimeout(()=>{btn.textContent=original;},1400);
      });
      document.getElementById('nativeSharePreview')?.addEventListener('click',async()=>{
        // Smart share:
        // mobile: native system share first; desktop/Facebook browser: Facebook popup fallback.
        if(shouldUseNativeShareFirst()){
          const shared = await shareProperty(data);
          if(shared) return;
        }
        openFacebookShare(shareUrl);
      });
      document.getElementById('facebookSharePreview')?.addEventListener('click',()=>{
        openFacebookShare(shareUrl);
      });
      renderSchema(data);
    }

    function getRelatedCards(currentSlug){
      return allProjects.filter(p=>p && p.slug && p.slug!==currentSlug && !p.isComingSoon).slice(0,3).map(project=>{
        const tr=project?.translations?.[currentLang]||project?.translations?.pl||{};
        const title=tr.title||project.title||project.slug;
        const meta=tr.meta||tr.subtitle||project.meta||safeLocation(project.location)||'';
        const image=getImage(project,0);
        const href=project.href||`/pl/new-developments/xml-catalog/?slug=${encodeURIComponent(project.slug)}`;
        return `<a class="related-card" href="${esc(href)}"><img src="${esc(image)}" alt="${esc(title)}" loading="lazy" decoding="async" fetchpriority="low" onerror="window.handleBrokenImage&&window.handleBrokenImage(this)"><div class="related-body"><span class="related-chip">Costa Blanca</span><div class="related-title">${esc(title)}</div><p class="related-meta">${esc(meta)}</p></div></a>`;
      }).join('');
    }

    function bindDynamicEvents(data){
      document.querySelectorAll('[data-media-src]').forEach(item=>item.addEventListener('click',()=>openMediaLightbox(item.dataset.mediaSrc)));
      document.getElementById('contact-form')?.addEventListener('submit',event=>{
        event.preventDefault();
        const formData=new FormData(event.currentTarget);
        const text=[
          `🏡 ${data.title}`,
          `💰 ${data.price}`,
          '',
          `👤 ${formData.get('name') || ''}`,
          `📞 ${formData.get('phone') || ''}`,
          `📧 ${formData.get('email') || ''}`,
          '',
          `💬 ${formData.get('message') || ''}`,
          '',
          `🔗 ${getShareUrl(data)}`
        ].join(String.fromCharCode(10));
        window.open(`https://wa.me/${CONTACT.whatsapp}?text=${encodeURIComponent(text)}`,'_blank','noopener');
      });
    }

    function renderSchema(data){
      const schema={'@context':'https://schema.org','@graph':[{'@type':'Organization',name:'Costa Blanca Invest',url:SITE_ORIGIN,email:CONTACT.email,telephone:CONTACT.phone},{'@type':'WebPage',name:data.title,url:getPropertyUrl(data),description:data.desc,inLanguage:currentLang,primaryImageOfPage:{'@type':'ImageObject',url:data.image}},{'@type':'Product',name:data.title,description:data.desc,image:data.images,brand:{'@type':'Brand',name:'Costa Blanca Invest'},offers:{'@type':'Offer',priceCurrency:'EUR',price:moneyNumber(data.price)||undefined,availability:'https://schema.org/InStock',url:getPropertyUrl(data)}}]};
      document.getElementById('schemaJson').textContent=JSON.stringify(schema,null,2);
    }

    function renderNotFound(projects){const ui=UI[currentLang]||UI.pl;const known=projects.map(p=>p.slug).filter(Boolean).slice(0,10).join('<br>');templateApp.className='not-found';templateApp.innerHTML=`<h1>${esc(ui.not_found)}</h1><p>slug: ${esc(requestedSlug)}</p><p style="font-size:14px;line-height:1.7">${known}</p><p><a class="btn btn-main" href="/pl/new-developments/">${esc(ui.back_link)}</a></p>`;}
    async function fetchJsonFrom(url){const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw new Error(`${url} HTTP ${response.status}`);const data=await response.json();if(!Array.isArray(data))throw new Error(`${url} is not array`);return data;}
    async function loadProjects(){
      const errors=[];
      for(const url of PROJECTS_URLS){
        try{
          const projects=await fetchJsonFrom(url);
          allProjects=projects;
          const item=findProject(projects,requestedSlug);
          if(!item){renderNotFound(projects);return;}
          await prepareProjectTranslations(item);
          renderProperty(item);
          console.info('projects.json loaded from',url);
          return;
        }catch(error){
          errors.push(error.message||String(error));
        }
      }
      console.warn('projects.json failed, using fallback',errors);
      allProjects=FALLBACK_PROJECTS;
      const fallback=findProject(FALLBACK_PROJECTS,requestedSlug)||FALLBACK_PROJECTS[0];
      await prepareProjectTranslations(fallback);
      renderProperty(fallback);
    }

    window.handleBrokenImage=function(img){if(img.dataset.fallbackApplied==='true')return;img.dataset.fallbackApplied='true';if(img.classList.contains('representative-avatar')){img.src=abs(AGENT_AVATAR);return;}img.src=abs(FALLBACK_IMAGE);};
    function openMediaLightbox(src){const box=document.getElementById('mediaLightbox');const content=document.getElementById('mediaLightboxContent');if(!box||!content||!src)return;content.innerHTML=`<img src="${esc(src)}" alt="Preview">`;box.classList.add('open');box.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';}
    function closeMediaLightbox(){const box=document.getElementById('mediaLightbox');const content=document.getElementById('mediaLightboxContent');if(!box||!content)return;box.classList.remove('open');box.setAttribute('aria-hidden','true');content.innerHTML='';document.body.style.overflow='';}
    document.getElementById('mediaLightboxClose')?.addEventListener('click',closeMediaLightbox);
    document.getElementById('mediaLightbox')?.addEventListener('click',event=>{if(event.target===event.currentTarget)closeMediaLightbox();});
    document.addEventListener('keydown',event=>{if(event.key==='Escape')closeMediaLightbox();});
    document.querySelectorAll('.lang-btn').forEach(btn=>btn.addEventListener('click',async()=>{
      currentLang=SUPPORTED_LANGS.includes(btn.dataset.lang)?btn.dataset.lang:'pl';
      syncLanguageUI();
      const url=new URL(window.location.href);
      if(currentLang==='pl')url.searchParams.delete('lang');else url.searchParams.set('lang',currentLang);
      window.history.replaceState({},'',`${url.pathname}${url.search}${url.hash}`);
      if(currentProperty){
        templateApp.className='loading';
        templateApp.textContent=currentLang==='pl'?'Ładowanie oferty...':currentLang==='es'?'Cargando la oferta...':currentLang==='en'?'Loading offer...':'Загрузка объекта...';
        await prepareProjectTranslations(currentProperty);
        renderProperty(currentProperty);
      }
    }));
   document.getElementById('backLink')?.addEventListener('click', (event) => {
  event.preventDefault();

  try {
    const ref = document.referrer;

    // если пришли с сайта и НЕ со share страницы
    if (
      ref &&
      ref.includes(window.location.origin) &&
      !ref.includes('/share/')
    ) {
      history.back();
      return;
    }
  } catch (e) {}

  // fallback — всегда в каталог
  window.location.href = '/pl/new-developments/';
});
    function runSelfTests(){const tests=[['short slug matches long slug',()=>findProject(FALLBACK_PROJECTS,'alonis-villas-la-villajoyosa-vila-joiosa')?.slug==='alonis-villas-la-villajoyosa-vila-joiosa-230606'],['absolute CDN stays CDN',()=>abs('https://example.com/a.jpg')==='https://example.com/a.jpg'],['relative local becomes absolute',()=>abs('/pl/a.jpg')==='https://costa-blanca-invest.com/pl/a.jpg'],['image array creates absolute images',()=>getImages(FALLBACK_PROJECTS[0]).map(abs).every(src=>src.startsWith('https://'))],['param label translates EN',()=>{const old=currentLang;currentLang='en';const ok=translateParamLabel('Lokalizacja')==='Location';currentLang=old;return ok;}],['param icon works after translation',()=>getParamIcon('Location')==='📍'],['buildData has params',()=>buildData(FALLBACK_PROJECTS[0]).paramEntries.length>0],['long slug resolves to short share slug',()=>resolveShareSlug({slug:'residencial-los-balcones-de-calpe-calpe-395273'})==='calpe-balcones'],['share URL points to static share page',()=>getShareUrl({slug:'residencial-los-balcones-de-calpe-calpe-395273'}).includes('/pl/new-developments/share/calpe-balcones.html')],['render template does not contain removed KPI join bug',()=>!String(renderProperty).includes("join('')}</div>")]];const failed=tests.filter(([,fn])=>{try{return !fn();}catch{return true;}});if(failed.length)console.warn('Template tests failed:',failed.map(([name])=>name));else console.info('Template tests passed:',tests.length);}
    syncLanguageUI();
    runSelfTests();
    loadProjects();
  </script>
