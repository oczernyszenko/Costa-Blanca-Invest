  <meta name="author" content="Olga Chernyshenko" />

  <meta property="og:type" content="website" />

  <style>
    :root{
      --primary:#183746;
      --primary-2:#234e63;
      --gold:#d9b56d;
      --gold-dark:#b89245;
      --bg:#f7f3ec;
      --surface:#ffffff;
      --text:#172532;
      --muted:#62707c;
      --line:rgba(24,55,70,.10);
      --shadow:0 18px 45px rgba(15,23,42,.08);
      --radius:28px;
      --container:1240px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:Inter,Arial,sans-serif;
      background:#fff;
      color:var(--text);
      line-height:1.72;
      overflow-x:hidden;
    }
    img{display:block;max-width:100%;height:auto}
    a{color:inherit;text-decoration:none}
    button,input,textarea{font:inherit}

    .page{padding:22px 0 70px;background:#fff}
    .container{width:100%;max-width:var(--container);margin:0 auto;padding:0 20px}

    .top-controls{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px}
    .back-link{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 16px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--gold-dark);font-weight:800;box-shadow:0 8px 20px rgba(15,23,42,.04)}
    .lang-switcher{display:flex;gap:8px}
    .lang-btn{width:36px;height:36px;border:0;border-radius:999px;background:#f3ead9;color:var(--gold-dark);font-size:12px;font-weight:900;cursor:pointer}
    .lang-btn.active{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#fff}

    .hero-card{position:relative;overflow:hidden;border-radius:32px;background:#111;box-shadow:var(--shadow)}
    .hero-media{position:relative;min-height:660px;cursor:zoom-in;background:#e9edf0}
    .hero-media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.04) 0%,rgba(0,0,0,.22) 42%,rgba(0,0,0,.74) 100%);z-index:1}
    .hero-media img{width:100%;height:100%;min-height:660px;object-fit:cover;background:#e9edf0}
    .hero-overlay{position:absolute;z-index:2;left:28px;right:28px;bottom:28px;display:grid;grid-template-columns:minmax(0,1fr) minmax(290px,380px);gap:24px;align-items:end}
    .hero-kicker{display:inline-flex;margin-bottom:12px;padding:9px 13px;border-radius:999px;background:rgba(255,255,255,.14);color:rgba(255,255,255,.86);font-size:11px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;border:1px solid rgba(255,255,255,.14)}
    h1{margin:0 0 12px;color:#fff;font-size:clamp(40px,5.8vw,82px);line-height:.93;letter-spacing:-.06em;text-shadow:0 18px 40px rgba(0,0,0,.35);max-width:900px}
    .hero-lead{max-width:720px;margin:0;color:rgba(255,255,255,.90);font-size:16px;line-height:1.72;text-shadow:0 12px 28px rgba(0,0,0,.30)}
    .hero-price-box{padding:22px;border-radius:26px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#fff}
    .price-label{display:block;margin-bottom:8px;font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.70)}
    .price-value{display:block;color:#fff8d6;font-size:clamp(26px,3vw,40px);font-weight:900;line-height:1;letter-spacing:-.05em}
    .price-meta{display:block;margin-top:10px;color:rgba(255,255,255,.90);font-size:13px;font-weight:700;line-height:1.55}
    .hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}

    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:999px;border:0;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-size:13px;font-weight:900;cursor:pointer;box-shadow:0 12px 26px rgba(15,23,42,.12)}
    .btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-dark))}
    .btn.whatsapp{background:linear-gradient(135deg,#25d366,#149e48)}
    .btn.light{background:#fff;color:var(--primary);border:1px solid var(--line)}

    .section{margin-top:34px;padding:42px;border-radius:var(--radius);background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
    .section.flat{padding:34px 8px;border:0;box-shadow:none;background:transparent;border-radius:0}
    .section h2{margin:0 0 22px;color:var(--primary);font-size:clamp(28px,3.6vw,44px);line-height:1.02;letter-spacing:-.04em}
    .section h2::after{content:"";display:block;width:70px;height:3px;margin-top:12px;border-radius:999px;background:linear-gradient(90deg,var(--gold),transparent)}

    .key-facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
    .fact-card{padding:20px;border-radius:22px;background:#fbf8f1;border:1px solid rgba(217,181,109,.18)}
    .fact-card strong{display:block;margin-bottom:6px;color:var(--muted);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}
    .fact-card span{display:block;color:var(--primary);font-size:16px;font-weight:900;line-height:1.35}

    .gallery-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
    .gallery-item{position:relative;overflow:hidden;aspect-ratio:1/1;border-radius:22px;background:#edf1f4;cursor:zoom-in;box-shadow:0 10px 24px rgba(15,23,42,.06)}
    .gallery-item img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
    .gallery-item:hover img{transform:scale(1.015)}
    .gallery-more-wrap{display:flex;justify-content:center;margin-top:18px}
    .gallery-hidden{display:none;margin-top:14px}
    .gallery-hidden.open{display:grid}

    .seo-description{max-width:1080px;margin:0;color:var(--text);font-size:clamp(18px,2vw,22px);line-height:1.9;letter-spacing:-.01em}

    .plans-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
    .plan-card{overflow:hidden;border-radius:22px;background:#fff;border:1px solid var(--line);box-shadow:0 10px 24px rgba(15,23,42,.06)}
    .plan-card img{width:100%;height:280px;object-fit:contain;background:#f8f6f1}
    .plan-title{padding:14px 16px;color:var(--primary);font-weight:900;font-size:14px}

    .spec-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .spec-row{display:grid;grid-template-columns:minmax(140px,.8fr) minmax(0,1.2fr);gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
    .spec-row strong{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
    .spec-row span{color:var(--primary);font-weight:800;line-height:1.45}

    .contact-box{text-align:center;background:linear-gradient(180deg,#fff,#f8fbfd)}
    .representative-card{display:grid;grid-template-columns:1fr 110px;gap:22px;align-items:center;max-width:900px;margin:0 auto 24px;padding:22px;border-radius:24px;background:#fff;border:1px solid rgba(217,181,109,.18);box-shadow:0 12px 30px rgba(15,23,42,.06);text-align:left}
    .avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid rgba(217,181,109,.25)}
    .representative-card h3{margin:0 0 4px;color:var(--primary);font-size:24px;letter-spacing:-.03em}
    .representative-card p{margin:0;color:var(--muted)}
    .share-preview{margin-top:22px;display:none;justify-content:center}
    .share-preview.open{display:flex}

    .lightbox{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(5,10,16,.94);z-index:9999}
    .lightbox.open{display:flex}
    .lightbox img{max-width:94vw;max-height:90vh;border-radius:18px;background:#111}
    .lightbox-close{position:absolute;top:18px;right:18px;width:44px;height:44px;border:0;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;font-size:26px;cursor:pointer}

    @media(max-width:980px){
      .hero-overlay{grid-template-columns:1fr}
      .hero-media,.hero-media img{min-height:520px}
      .key-facts{grid-template-columns:repeat(2,minmax(0,1fr))}
      .gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .spec-grid{grid-template-columns:1fr}
    }
    @media(max-width:560px){
      .container{padding:0 10px}
      .page{padding-top:14px}
      .top-controls{display:grid;grid-template-columns:1fr auto;gap:10px}
      .back-link{font-size:13px;padding:0 12px}
      .hero-card,.section{border-radius:20px}
      .hero-media,.hero-media img{min-height:360px}
      .hero-overlay{left:14px;right:14px;bottom:14px;gap:14px}
      h1{font-size:clamp(30px,10vw,44px)}
      .hero-lead{font-size:14px;line-height:1.58}
      .hero-price-box{padding:16px;border-radius:20px}
      .section{padding:24px;margin-top:24px}
      .section.flat{padding:20px 2px}
      .key-facts,.gallery-grid,.plans-grid{grid-template-columns:1fr}
      .gallery-item{aspect-ratio:1.12/1}
      .spec-row{grid-template-columns:1fr;gap:4px}
      .representative-card{grid-template-columns:1fr;text-align:center}
      .avatar{margin:0 auto;order:-1}
      .btn{width:100%}
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="container">
      <div class="top-controls">
        <a class="back-link" id="backLink" href="/pl/new-developments/">← Wróć do katalogu</a>
        <div class="lang-switcher" aria-label="Language switcher">
          <button class="lang-btn active" type="button" data-lang="pl">PL</button>
          <button class="lang-btn" type="button" data-lang="es">ES</button>
          <button class="lang-btn" type="button" data-lang="en">EN</button>
          <button class="lang-btn" type="button" data-lang="ru">RU</button>
        </div>
      </div>

      <div id="templateApp">Loading...</div>
    </div>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" type="button" id="lightboxClose">×</button>
    <img id="lightboxImg" src="" alt="" />
  </div>

  <script type="application/ld+json" id="schemaJson"></script>

  <script>
    const PROJECTS_URLS = [
      '/pl/new-developments/projects_clean_luxury_structure_v2026-05-13.json',
      './projects_clean_luxury_structure_v2026-05-13.json',
      '/pl/new-developments/ultimate_properties_master_beautiful_multilang.json',
      './ultimate_properties_master_beautiful_multilang.json',
      '/pl/new-developments/projects.json',
      './projects.json'
    ];

    const SITE_ORIGIN = 'https://costa-blanca-invest.com';
    const LIVE_CATEGORY_PATH = '/pl/new-developments/';
    const AGENT_AVATAR = '/avatar.png';
    const FALLBACK_IMAGE = '/pl/new-developments/images/new-developments-costa-blanca.jpg';
    const SUPPORTED_LANGS = ['pl','es','en','ru'];
    const CONTACT = { name:'Olga Chernyshenko', brand:'Costa Blanca Invest', phone:'+34 604 158 859', email:'olga@a1invest4u.com', whatsapp:'34604158859' };

    const UI = {
      pl:{back:'← Wróć do katalogu',price:'Cena',gallery:'Galeria',showAll:'Zobacz wszystkie zdjęcia',hideAll:'Ukryj zdjęcia',facts:'Kluczowe parametry',about:'O projekcie',plans:'Plany i dostępność',spec:'Co jest w standardzie',contact:'Zapytaj o tę ofertę',wa:'WhatsApp',call:'Zadzwoń',copy:'Kopiuj link',copied:'Skopiowano',noCommission:'Bez prowizji dla kupującego · bezpośrednie warunki dewelopera.'},
      es:{back:'← Volver al catálogo',price:'Precio',gallery:'Galería',showAll:'Ver todas las fotos',hideAll:'Ocultar fotos',facts:'Datos principales',about:'Sobre el proyecto',plans:'Planos y disponibilidad',spec:'Qué está incluido',contact:'Solicitar información',wa:'WhatsApp',call:'Llamar',copy:'Copiar enlace',copied:'Copiado',noCommission:'Sin comisión para el comprador · condiciones directas del promotor.'},
      en:{back:'← Back to catalog',price:'Price',gallery:'Gallery',showAll:'View all photos',hideAll:'Hide photos',facts:'Key facts',about:'About the project',plans:'Floor plans and availability',spec:'What is included',contact:'Request information',wa:'WhatsApp',call:'Call',copy:'Copy link',copied:'Copied',noCommission:'No buyer commission · direct developer conditions.'},
      ru:{back:'← Вернуться в каталог',price:'Цена',gallery:'Галерея',showAll:'Смотреть все фото',hideAll:'Скрыть фото',facts:'Ключевые параметры',about:'О проекте',plans:'Планировки и доступность',spec:'Что включено',contact:'Запросить информацию',wa:'WhatsApp',call:'Позвонить',copy:'Скопировать ссылку',copied:'Скопировано',noCommission:'Без комиссии для покупателя · прямые условия застройщика.'}
    };

    const params = new URLSearchParams(location.search);
    const requestedSlug = params.get('slug') || 'bonalba-golf-hills';
    let currentLang = SUPPORTED_LANGS.includes(params.get('lang')) ? params.get('lang') : 'pl';
    let projects = [];
    let currentProperty = null;
    const templateApp = document.getElementById('templateApp');

    function esc(v){return String(v ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));}
    function arr(v){return Array.isArray(v) ? v : []}
    function abs(path){
      if(!path) return SITE_ORIGIN + FALLBACK_IMAGE;
      if(/^https?:\/\//i.test(path)) return path;
      if(path.startsWith('/')) return SITE_ORIGIN + path;
      return SITE_ORIGIN + '/' + path.replace(/^\.\//,'');
    }
    function unique(list){
      const seen = new Set();
      return arr(list).filter(Boolean).map(x => typeof x === 'string' ? x : (x.src || x.url || x.href || x.image || '')).filter(Boolean).filter(src => {
        const key = src.replace(/-(preview|medium|large|small)(?=\.)/i,'').toLowerCase();
        if(seen.has(key)) return false;
        seen.add(key); return true;
      });
    }
    function tr(item){return item?.translations?.[currentLang] || item?.translations?.pl || item || {};}
    function seoArticleText(item){
      return item?.editorialSeoDescription?.[currentLang]
        || item?.seoDescriptionMultilang?.[currentLang]
        || item?.translations?.[currentLang]?.pageDescription
        || item?.translations?.pl?.pageDescription
        || '';
    }
    function seoTitle(item){return item?.seoFinalMultilang?.[currentLang]?.title || tr(item).seoTitle || item.seoTitle || item.title || 'Costa Blanca Invest'}
    function metaDesc(item){return item?.seoFinalMultilang?.[currentLang]?.description || tr(item).seoDescription || item.seoDescription || seoArticleText(item).slice(0,160)}
    function imagesOf(item){return unique([item.image, ...(item.images || []), ...(item?.media?.gallery || []), ...(item?.galleryOrdered?.photos || [])]);}
    function plansOf(item){return [...arr(item.floorPlans), ...arr(item?.media?.floorPlans), ...arr(item?.galleryOrdered?.floorPlans)].filter(Boolean);}
    function docsOf(item){return [...arr(item.documents), ...arr(item?.media?.documents), ...arr(item?.galleryOrdered?.documents)].filter(Boolean);}
    function getKeyFacts(item){
      const ready = item?.keyFactsMultilang?.[currentLang];
      if(Array.isArray(ready) && ready.length) return ready;
      const t = tr(item);
      return [
        {label: currentLang==='ru'?'Локация':currentLang==='en'?'Location':currentLang==='es'?'Ubicación':'Lokalizacja', value:t.meta || item.meta || item?.location?.address},
        {label: currentLang==='ru'?'Цена':currentLang==='en'?'Price':currentLang==='es'?'Precio':'Cena', value:t.price || item.price || item?.pricing?.priceText},
        {label: currentLang==='ru'?'Тип':currentLang==='en'?'Type':currentLang==='es'?'Tipo':'Typ', value:t.chip || item.chip || item?.specs?.propertyType},
        {label: currentLang==='ru'?'Площадь':currentLang==='en'?'Area':currentLang==='es'?'Superficie':'Powierzchnia', value:item?.specs?.builtArea || item?.keyFacts?.builtArea || ''}
      ].filter(x => x.value);
    }
    function getSpecs(item){
      const ready = item?.specificationMultilang?.[currentLang] || item?.specificationMultilang?.pl;
      return Array.isArray(ready) ? ready.filter(row => row && row.label && row.value) : [];
    }
    function propertyUrl(item){return `${SITE_ORIGIN}/pl/new-developments/xml-catalog/?slug=${encodeURIComponent(item.slug)}&lang=${currentLang}`;}
    function shareUrl(item){return `${SITE_ORIGIN}/pl/new-developments/share/${encodeURIComponent(item.shareSlug || item.slug)}.html`;}

    function updateMeta(item){
      const title = seoTitle(item);
      const desc = metaDesc(item);
      const img = abs(imagesOf(item)[0]);
      const url = propertyUrl(item);
      document.documentElement.lang = currentLang;
      document.getElementById('dynamicTitle').textContent = title;
      document.getElementById('dynamicDescription').setAttribute('content', desc);
      document.getElementById('canonicalLink').setAttribute('href', url);
      document.getElementById('ogTitle').setAttribute('content', title);
      document.getElementById('ogDescription').setAttribute('content', desc);
      document.getElementById('ogUrl').setAttribute('content', url);
      document.getElementById('ogImage').setAttribute('content', img);
      document.getElementById('twitterTitle').setAttribute('content', title);
      document.getElementById('twitterDescription').setAttribute('content', desc);
      document.getElementById('twitterImage').setAttribute('content', img);
      document.getElementById('schemaJson').textContent = JSON.stringify({
        '@context':'https://schema.org', '@type':'RealEstateListing', name:title, description:desc, image:img, url:url, brand:'Costa Blanca Invest', inLanguage:currentLang
      });
    }

    function renderGallery(images){
      const first = images.slice(0,4);
      const rest = images.slice(4);
      return `<section class="section" id="gallery">
        <h2>${esc(UI[currentLang].gallery)}</h2>
        <div class="gallery-grid">${first.map(src => galleryItem(src)).join('')}</div>
        ${rest.length ? `<div class="gallery-more-wrap"><button class="btn light" id="showAllGallery" type="button">${esc(UI[currentLang].showAll)} (${images.length})</button></div><div class="gallery-grid gallery-hidden" id="hiddenGallery">${rest.map(src => galleryItem(src)).join('')}</div>` : ''}
      </section>`;
    }
    function galleryItem(src){return `<button class="gallery-item" type="button" data-lightbox="${esc(abs(src))}"><img src="${esc(abs(src))}" loading="lazy" decoding="async" alt="Costa Blanca Invest"></button>`}

    function renderPlans(plans, docs){
      if(!plans.length && !docs.length) return '';
      return `<section class="section" id="plans"><h2>${esc(UI[currentLang].plans)}</h2>
        ${plans.length ? `<div class="plans-grid">${plans.map((plan,i)=>{
          const src = typeof plan === 'string' ? plan : (plan.src || plan.url || plan.href || plan.image || '');
          const label = typeof plan === 'object' ? (plan.title || plan.name || plan.label || `Plan ${i+1}`) : `Plan ${i+1}`;
          return src ? `<a class="plan-card" href="${esc(abs(src))}" target="_blank" rel="noopener"><img src="${esc(abs(src))}" loading="lazy" decoding="async" alt="${esc(label)}"><div class="plan-title">${esc(label)}</div></a>` : `<div class="plan-card"><div class="plan-title">${esc(label)}</div></div>`;
        }).join('')}</div>` : ''}
        ${docs.length ? `<div class="hero-actions" style="margin-top:18px">${docs.map((doc,i)=>{
          const href = typeof doc === 'string' ? doc : (doc.href || doc.url || doc.src || '');
          const label = typeof doc === 'object' ? (doc.title || doc.name || doc.label || `PDF ${i+1}`) : `PDF ${i+1}`;
          return href ? `<a class="btn light" href="${esc(abs(href))}" target="_blank" rel="noopener">${esc(label)}</a>` : '';
        }).join('')}</div>` : ''}
      </section>`;
    }

    function renderProperty(item){
      currentProperty = item;
      const t = tr(item);
      const ui = UI[currentLang];
      const images = imagesOf(item);
      const heroImage = abs(images[0]);
      const keyFacts = getKeyFacts(item);
      const specs = getSpecs(item);
      const plans = plansOf(item);
      const docs = docsOf(item);
      const price = t.price || item.price || item?.pricing?.priceText || '';
      const meta = t.meta || item.meta || item?.location?.address || '';
      const lead = t.desc || item.desc || '';
      const text = seoArticleText(item);
      const waText = encodeURIComponent([`🏡 ${item.title}`, `💰 ${price}`, `🔗 ${shareUrl(item)}`].filter(Boolean).join('\n'));

      updateMeta(item);
      document.getElementById('backLink').textContent = ui.back;

      templateApp.innerHTML = `
        <article>
          <section class="hero-card">
            <div class="hero-media" data-lightbox="${esc(heroImage)}">
              <img src="${esc(heroImage)}" alt="${esc(t.alt || item.title)}" loading="eager" fetchpriority="high" decoding="async">
              <div class="hero-overlay">
                <div>
                  <div class="hero-kicker">${esc(meta || 'Costa Blanca Invest')}</div>
                  <h1>${esc(t.title || item.title)}</h1>
                  <p class="hero-lead">${esc(lead)}</p>
                </div>
                <aside class="hero-price-box">
                  <small>${esc(ui.price)}</small>
                  <span class="price-value">${esc(price)}</span>
                  <span class="price-meta">${esc(meta)}</span>
                  <div class="hero-actions">
                    <a class="btn whatsapp" href="https://wa.me/${CONTACT.whatsapp}?text=${waText}" target="_blank" rel="noopener">${esc(ui.wa)}</a>
                    <button class="btn light" type="button" id="copyLinkBtn">${esc(ui.copy)}</button>
                  </div>
                </aside>
              </div>
            </div>
          </section>

          <section class="section">
            <h2>${esc(ui.facts)}</h2>
            <div class="key-facts">${keyFacts.map(f=>`<div class="fact-card"><strong>${esc(f.label)}</strong><span>${esc(f.value)}</span></div>`).join('')}</div>
          </section>

          ${renderGallery(images)}

          ${text ? `<section class="section flat seo-article-section"><h2>${esc(ui.about)}</h2><p class="seo-description">${esc(text)}</p></section>` : ''}

          ${renderPlans(plans, docs)}

          ${specs.length ? `<section class="section"><h2>${esc(ui.spec)}</h2><div class="spec-grid">${specs.map(s=>`<div class="spec-row"><strong>${esc(s.label)}</strong><span>${esc(s.value)}</span></div>`).join('')}</div></section>` : ''}

          <section class="section contact-box" id="contact">
            <h2>${esc(ui.contact)}</h2>
            <div class="representative-card">
              <div><h3>${esc(CONTACT.name)}</h3><p><strong>${esc(CONTACT.brand)}</strong></p><p>${esc(ui.noCommission)}</p></div>
              <img class="avatar" src="${esc(abs(AGENT_AVATAR))}" alt="Olga Costa Blanca Invest">
            </div>
            <div class="hero-actions" style="justify-content:center">
              <a class="btn gold" href="tel:${CONTACT.phone.replace(/\s/g,'')}">${esc(ui.call)}</a>
              <a class="btn whatsapp" href="https://wa.me/${CONTACT.whatsapp}?text=${waText}" target="_blank" rel="noopener">${esc(ui.wa)}</a>
              <button class="btn light" type="button" id="copyLinkBtn2">${esc(ui.copy)}</button>
            </div>
          </section>
        </article>`;

      bindRuntime();
    }

    function bindRuntime(){
      document.querySelectorAll('[data-lightbox]').forEach(el=>el.addEventListener('click',()=>openLightbox(el.dataset.lightbox)));
      const hidden = document.getElementById('hiddenGallery');
      const showBtn = document.getElementById('showAllGallery');
      if(showBtn && hidden){
        showBtn.addEventListener('click',()=>{
          hidden.classList.toggle('open');
          showBtn.textContent = hidden.classList.contains('open') ? UI[currentLang].hideAll : `${UI[currentLang].showAll} (${imagesOf(currentProperty).length})`;
        });
      }
      ['copyLinkBtn','copyLinkBtn2'].forEach(id=>{
        const btn = document.getElementById(id);
        if(btn) btn.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(shareUrl(currentProperty)); btn.textContent = UI[currentLang].copied;}catch(e){location.href = shareUrl(currentProperty);}});
      });
    }

    function openLightbox(src){
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightbox').classList.add('open');
    }
    document.getElementById('lightboxClose').addEventListener('click',()=>document.getElementById('lightbox').classList.remove('open'));
    document.getElementById('lightbox').addEventListener('click',e=>{if(e.target.id==='lightbox') e.currentTarget.classList.remove('open')});

    document.querySelectorAll('.lang-btn').forEach(btn=>{
      btn.addEventListener('click',()=>{
        currentLang = btn.dataset.lang;
        document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active', b.dataset.lang===currentLang));
        if(currentProperty) renderProperty(currentProperty);
      });
    });

    async function loadProjects(){
      for(const url of PROJECTS_URLS){
        try{
          const res = await fetch(url, {cache:'no-store'});
          if(!res.ok) continue;
          const data = await res.json();
          if(Array.isArray(data) && data.length) return data;
        }catch(e){
          // Canvas/local preview can block fetch. Fallback below keeps the template visible.
        }
      }
      return [];
    }

    loadProjects().then(data=>{
      projects = data;
      const item = projects.find(p => p.slug === requestedSlug || p.canonicalSlug === requestedSlug || p.shareSlug === requestedSlug) || projects[0];
      if(!item){templateApp.innerHTML = '<div class="section">Błąd ładowania oferty.</div>'; return;}
      renderProperty(item);
    }).catch(()=>templateApp.innerHTML = '<div class="section">Błąd ładowania oferty.</div>');
  </script>
</body>
</html>
